apiVersion: v1
kind: Service
metadata:
  name: s3
  namespace: projetde
spec:
  clusterIP: None
  publishNotReadyAddresses: true
  selector:
    app: s3
  ports:
    - port: 8333
      targetPort: 8333
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: s3
  namespace: projetde
spec:
  serviceName: s3
  replicas: 1
  selector:
    matchLabels:
      app: s3
  template:
    metadata:
      labels:
        app: s3
    spec:
      automountServiceAccountToken: false
      containers:
        - name: s3
          image: chrislusf/seaweedfs:4.48
          args: ["mini", "-dir=/data", "-ip=s3-0.s3", "-ip.bind=0.0.0.0"]
          env:
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: S3_ACCESS_KEY
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: pipeline-secrets
                  key: S3_SECRET_KEY
            - name: S3_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: pipeline-config
                  key: S3_BUCKET
          ports:
            - containerPort: 8333
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: 8333
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
